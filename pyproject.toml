# 本文件承载项目元数据与开发工具配置。
#
# 依赖只在 requirements.txt / requirements-dev.txt 声明（避免与这里两处漂移），
# 因此**不写** [project].dependencies；也不加 build-system——本项目是可运行的
# 桌面工具（两个 .cmd 入口），不是要分发安装的库。

[project]
name = "tg-picker"
version = "0.1.0"
description = "绕过 Telegram「禁止保存」的图片挑选器：读本地 tdata 缓存，或走账号 API 在线挑选下载"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["telegram", "tdata", "tkinter", "media-picker"]

[project.urls]
Homepage = "https://github.com/yunyiss/tg-picker"
Repository = "https://github.com/yunyiss/tg-picker"
Issues = "https://github.com/yunyiss/tg-picker/issues"

# ---------------------------------------------------------------------------
# 代码风格：只启用确定性检查（未使用导入、导入排序等），不做格式化重排。
# _vendor/ 是上游 tg-scoop 的原样副本，不参与 lint。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# conftest 需要先修改 sys.path 再导入被测模块
"tests/*" = ["E402"]

# ---------------------------------------------------------------------------
# 测试：默认跑 tests/ 下全部用例；GUI 用例标记 gui，无显示器时自动 skip，
# 也可用 `pytest -m "not gui"` 显式排除。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: 需要显示器与 Tk 的界面测试（无显示器会自动跳过）",
]