# 本文件承载项目元数据与开发工具配置。
#
# 依赖只在 requirements.txt / requirements-dev.txt 声明（避免与这里两处漂移），
# 因此**不写** [project].dependencies；也不加 build-system——本项目是可运行的
# 桌面工具（两个 .cmd 入口），不是要分发安装的库。

[project]
name = "tg-picker"
version = "0.1.0"
description = "绕过 Telegram「禁止保存」的图片挑选器：读本地 tdata 缓存，或走账号 API 在线挑选下载"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["telegram", "tdata", "tkinter", "media-picker"]

[project.urls]
Homepage = "https://github.com/yunyiss/tg-picker"
Repository = "https://github.com/yunyiss/tg-picker"
Issues = "https://github.com/yunyiss/tg-picker/issues"

# ---------------------------------------------------------------------------
# 代码风格：只启用确定性检查（未使用导入、导入排序等），不做格式化重排。
# _vendor/ 是上游 tg-scoop 的原样副本，不参与 lint。
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["_vendor"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C90", "N"]

# 圈复杂度上限：15 以上会被拦下（个别天然分支多的函数在下方的 per-file 里豁免）。
[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# conftest 需要先修改 sys.path 再导入被测模块
"tests/*" = ["E402", "C901", "N806"]
# tg_picker 是异步 + GUI 编排：登录/分页扫描的分支天然较多，不设复杂度上限
"tg_picker.py" = ["C901"]
# LangMixin 的 _T 是"登记并翻译文案"的注册器，刻意用大写 T 与 t() 呼应
"ui_lang.py" = ["N802"]

# ---------------------------------------------------------------------------
# 测试：默认跑 tests/ 下全部用例；GUI 用例标记 gui，无显示器时自动 skip，
# 也可用 `pytest -m "not gui"` 显式排除。
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "gui: 需要显示器与 Tk 的界面测试（无显示器会自动跳过）",
]

# ---------------------------------------------------------------------------
# 类型检查：只覆盖"纯逻辑"模块——领域层（cache_source）与共享叶子模块
# （ui_kit / ui_lang / i18n）。两个 GUI 模块大量使用 Tk 控件对象与回调，
# 注解收益低而噪声大，暂不纳入；待其属性补齐标注后再逐步扩大范围。
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["cache_source.py", "ui_kit.py", "ui_lang.py", "ui_style.py", "i18n.py", "app_paths.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true