name: CI

# 门禁：Windows 与 Linux 两个平台各跑一遍静态检查与测试。
# GUI 用例（标记 gui）在无显示器的 CI 上会被排除；需要真实 tdata 的用例
# 因找不到 tdata 而自动 skip——因此 CI 只保证"纯逻辑 + 单测"这条线不退化。
on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # requires-python 是 >=3.11，这里把三个受支持的版本都跑一遍，
        # 避免"声明的下限"从未被验证过。
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 Tk（Linux 无内置 Tk，conftest 顶层 import tkinter 需要它）
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: 静态检查（ruff）
        run: python -m ruff check .

      - name: 类型检查（mypy）
        run: python -m mypy

      - name: 测试（跳过需要显示器的 GUI 用例）
        run: python -m pytest -m "not gui" -q
